name: Publish Web to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Ballance v<version> release to deploy or roll back to
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      sha256: ${{ steps.prepare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Download and verify Web release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir download public
          archive=$(PYTHONPATH=scripts python3 -c 'import os; from release_identity import asset_name; print(asset_name(os.environ["RELEASE_TAG"]))')
          gh release download "$RELEASE_TAG" --pattern "$archive" --pattern "$archive.sha256" --dir download
          python3 scripts/prepare-pages.py download public "$RELEASE_TAG"
          echo "sha256=$(jq -r .sha256 public/release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha256 }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              "${PAGE_URL%/}/release.json?tag=$RELEASE_TAG&attempt=$attempt" -o deployed-release.json \
              && jq -e --arg tag "$RELEASE_TAG" --arg sha "$EXPECTED_SHA" '.tag == $tag and .sha256 == $sha' deployed-release.json; then
              echo "Verified $RELEASE_TAG at $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not serve the requested release: $RELEASE_TAG" >&2
          exit 1
