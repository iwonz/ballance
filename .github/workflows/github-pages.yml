name: Publish Ballance and Reballance to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      source: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Select the approved unified release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_identity import read_manifest
          path = Path('site/releases.json')
          manifest = read_manifest(path)
          event = os.environ.get('RELEASE_TAG')
          if event and event != manifest['release']:
              raise RuntimeError('Published tag is not the approved unified release in main')
          shutil.copyfile(path, Path(os.environ['RUNNER_TEMP']) / 'approved-release.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + manifest['release'] + '\n')
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin immutable deployment source
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          cmp site/releases.json "$RUNNER_TEMP/approved-release.json"
          python3 - <<'PY'
          import json, subprocess
          with open('site/releases.json') as source:
              manifest = json.load(source)
          for edition, pin in manifest['editions'].items():
              branch = 'original' if edition == 'original' else 'main'
              subprocess.run(['git', 'merge-base', '--is-ancestor', pin['tag'], 'origin/' + branch], check=True)
          PY
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify both games and the attached site from one release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/prepare-release.py verify download public --fetch
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the distribution and both public players
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 scripts/verify-site.py "$PAGE_URL" site/releases.json
          echo "Verified both pinned editions at $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
