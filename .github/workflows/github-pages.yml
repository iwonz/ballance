name: Publish Web to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing Ballance-*-WebGL.tar.gz and its checksum
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify Web release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir download public
          gh release download "$RELEASE_TAG" --pattern 'Ballance-*-WebGL.tar.gz*' --dir download
          python3 scripts/prepare-pages.py download public "$RELEASE_TAG"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              "${PAGE_URL%/}/release.json?tag=$RELEASE_TAG&attempt=$attempt" -o deployed-release.json \
              && jq -e --arg tag "$RELEASE_TAG" '.tag == $tag' deployed-release.json; then
              echo "Verified $RELEASE_TAG at $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not serve the requested release: $RELEASE_TAG" >&2
          exit 1
