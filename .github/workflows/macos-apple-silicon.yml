name: Build checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  agent-context:
    name: Check OpenSpec and agent context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.11.0
      - name: Validate specifications and maintenance context
        run: |
          openspec validate --all --strict --no-interactive
          python3 scripts/test-agent-context.py
          python3 scripts/test-web-performance.py
          node --check scripts/measure-web-performance.js
          node scripts/test-web-lifecycle.js
          python3 scripts/check-agent-context.py
      - name: Require a completed change record in this delivery
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            python3 scripts/check-agent-context.py --base "$BASE_SHA"
          fi
  native-check:
    name: Check shipped ARM64 physics
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check scripts and native plugin
        run: |
          python3 scripts/check-localization.py
          python3 scripts/check-physics-abi.py
          bash -n scripts/build-macos.sh scripts/build.sh scripts/setup-openspec.sh
          python3 scripts/test-release-tools.py
          python3 scripts/test-install-macos.py
          python3 -c 'import ast; from pathlib import Path; ast.parse(Path("scripts/package-macos.py").read_text())'
          test "$(uname -m)" = arm64
          lipo Assets/BallancePhysics/Plugins/macOS/libbphysics.dylib -verify_arch arm64
          xcrun clang++ -arch arm64 -std=c++11 -Wall -Wextra -Werror scripts/physics-smoke.cpp -o "$RUNNER_TEMP/physics-smoke"
          "$RUNNER_TEMP/physics-smoke" "$PWD/Assets/BallancePhysics/Plugins/macOS/libbphysics.dylib"
